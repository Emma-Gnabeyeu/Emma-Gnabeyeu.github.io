# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Papers
    url: /publications/     # Update this to the full URL for your publications page
    weight: 11
  - name: Talks
    url: /events/           # Update this to the full URL for your talks page
    weight: 12
  - name: News
    url: /courses/  # /#news
    weight: 13
  - name: Experience
    url: /experience/
    weight: 20
  - name: Courses
    url: /courses/
    weight: 40
